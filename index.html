<!doctype html>

<html lang="ar" dir="rtl">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>نظام مكتب التمويل</title>

<style>

:root{

  --bg:#f4f5f7;

  --card:#ffffff;

  --ink:#18212f;

  --mut:#667085;

  --line:#e4e7ec;

  --nav:#16233b;

  --pri:#16233b;

  --onpri:#ffffff;

  --gold:#c8963e;

  --ok:#188a5b;

  --bad:#c0392b;

  --b1:#16233b;

  color-scheme:light;

}

@media(prefers-color-scheme:dark){

  :root{

    --bg:#0c1320;

    --card:#141d2e;

    --ink:#e8edf6;

    --mut:#93a0b8;

    --line:#25314a;

    --nav:#0a101c;

    --pri:#d9a954;

    --onpri:#1a1405;

    --gold:#e0b35a;

    --ok:#4cc38a;

    --bad:#f08a7c;

    --b1:#7d97e6;

    color-scheme:dark;

  }

}

*{box-sizing:border-box}

html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}

button,input,select,textarea{font:inherit;color:inherit}

h2,h3{margin:0;line-height:1.35}

input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}

textarea{font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;direction:ltr;resize:vertical}

input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

label{display:block;font-size:13px;color:var(--mut);margin:0 0 4px}

.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px}

.btn:disabled{opacity:.55;cursor:not-allowed}

.btn.sm{padding:6px 12px;font-size:13px;min-height:34px}

.btn.ghost{background:transparent;color:inherit;border:1px solid var(--line);font-weight:500}

.btn.del{background:transparent;color:var(--bad);border:1px solid var(--line);font-weight:600}

.login{min-height:100dvh;display:grid;place-items:center;padding:18px}

.lbox{width:100%;max-width:420px;background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.06)}

.lh{background:var(--nav);color:#fff;padding:22px}

.lh h2{font-size:20px}

.lh span{color:#aab6cc;font-size:13px;display:block;margin-top:4px}

.lb{padding:20px 22px}

.lb .fg{margin-bottom:13px}

.note{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--mut);line-height:1.6}

.shell{display:flex;min-height:100dvh}

.side{position:fixed;top:0;bottom:0;inset-inline-start:0;width:240px;background:var(--nav);color:#cfd6e4;padding:calc(18px + env(safe-area-inset-top,0px)) 0 calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s ease;z-index:30;overflow-y:auto}

.side.open{transform:translateX(0)}

.brand{padding:0 20px 16px;margin-bottom:8px;display:flex;flex-direction:column;border-bottom:1px solid rgba(255,255,255,.1)}

.brand b{color:#fff;font-size:17px}

.brand span{font-size:12px;color:#93a0b8}

.side>button{background:none;border:0;text-align:start;padding:12px 20px;color:inherit;font-size:15px;cursor:pointer;min-height:44px}

.side>button.on{color:#fff;font-weight:700;background:rgba(255,255,255,.09);box-shadow:inset -3px 0 0 var(--gold)}

.who{margin-top:auto;padding:14px 20px 0;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:6px;align-items:flex-start}

.who span{font-size:12.5px;color:#93a0b8}

.who .btn.ghost{color:#fff;border-color:rgba(255,255,255,.25)}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none}

.ov.show{display:block}

main{flex:1;min-width:0;padding:14px 14px calc(36px + env(safe-area-inset-bottom,0px))}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}

.top-r{display:flex;align-items:center;gap:8px}

.top h2{font-size:20px}

.dt{display:none;color:var(--mut);font-size:13px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--mut)}

.dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}

.pill.ok .dot{background:var(--ok)}

.pill.err .dot{background:var(--bad)}

.hero{background:var(--nav);color:#fff;border-radius:18px;padding:20px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:16px 28px;justify-content:space-between;align-items:flex-end}

.hero small{color:#aab6cc;font-size:13px;display:block}

.big{font-size:32px;font-weight:700;color:var(--gold);line-height:1.2}

.hs{display:flex;gap:24px;flex-wrap:wrap}

.hs b{font-size:16.5px;display:block}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:14px}

.t{text-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer}

.t small{display:block;color:var(--mut);font-size:12.5px}

.t b{display:block;font-size:19px;margin-top:3px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}

.card h3{font-size:16px;margin-bottom:12px}

.two{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}

.item{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line)}

.item:last-child{border:0}

.im{display:flex;flex-direction:column;min-width:0}

.im span,.is small{color:var(--mut);font-size:12.5px}

.is{display:flex;flex-direction:column;align-items:flex-end}

.is b{font-size:15px}

.ia{flex-basis:100%;display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}

.tag{padding:1px 10px;border-radius:99px;font-size:12px;border:1px solid currentColor;margin-top:3px}

.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--gold)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 6px;align-items:center}

.chip{background:none;border:1px solid var(--line);border-radius:99px;padding:5px 14px;cursor:pointer;color:var(--mut);font-size:13.5px;min-height:34px}

.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri);font-weight:700}

.bar{height:7px;background:var(--line);border-radius:9px;overflow:hidden;margin:5px 0 12px}

.bar i{display:block;height:100%;background:var(--gold)}

.sp{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;flex-wrap:wrap}

.lg{display:flex;gap:14px;font-size:12.5px;color:var(--mut);margin-bottom:8px}

.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px}

.empty{color:var(--mut);padding:10px 0}

.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:12px;margin:auto;max-width:420px;background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:12px;text-align:center;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.22)}

.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}

table{width:100%;border-collapse:collapse;font-size:13.5px}

th,td{padding:9px 8px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}

th{color:var(--mut);font-weight:600}

tfoot td{font-weight:700;border-top:2px solid var(--line)}

.rh{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;align-items:flex-end}

.rh h3{margin:0;font-size:18px}

.rh span{color:var(--mut);font-size:13px}

.sel{max-width:340px;margin-bottom:12px}

.dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:50;padding:18px}

.dlg[hidden]{display:none}

.dbox{background:var(--card);border-radius:14px;padding:20px;max-width:420px;width:100%;border:1px solid var(--line)}

.dbox p{margin:0 0 14px}

@media(max-width:899px){.two{grid-template-columns:1fr}}

@media(min-width:900px){

  .side{transform:none}

  .menu,.ov,.ov.show{display:none}

  .dt{display:inline}

  main{margin-inline-start:240px;padding:22px 28px 40px;max-width:1180px}

}

@media print{

  .side,.ov,.menu,.noprint,.chips,.sel,.top .dt,.pill{display:none!important}

  main{margin:0!important;padding:0!important;max-width:none!important}

  body{background:#fff;color:#000}

  .card,.t{border-color:#bbb}

}

</style>

</head>

<body>

<div id="app"></div>

<div id="toast" class="toast" hidden></div>

<div id="dlg" class="dlg" hidden></div>



<script>

const APP_ID = 'tamweel-office-v1';

const FIREBASE_CFG = {

  apiKey: "AIzaSyDqazjjq3-_wdpoMWyVkfYHYoIQRz6-8qo",

  authDomain: "tamweel-office.firebaseapp.com",

  projectId: "tamweel-office",

  storageBucket: "tamweel-office.firebasestorage.app",

  messagingSenderId: "237804833905",

  appId: "1:237804833905:web:c4ed88ce46f0c756f99fd0",

  measurementId: "G-9K8ZSS64S5"

};



let fb = null, db = null, user = null, unsub = null;

let syncStatus = 'syncing';

let syncText = 'جاري المزامنة...';



const ROLE = { admin: 'مدير', acc: 'محاسب', view: 'مشاهدة فقط' };

const LB = { dep: 'إيداع', wd: 'سحب', exp: 'مصروف', fin: 'تمويل عميل', pay: 'سداد عميل' };

const TODAY = new Date().toISOString().slice(0, 10);

const MN = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

const DEFC = ['إيجار','إنترنت','كهرباء','مياه','رواتب','دعاية','صيانة','مستلزمات مكتبية','رسوم حكومية','أخرى'];



function freshState() {

  return {

    cfg: { office: 'مكتب التمويل', rate: 30, due: 27 },

    inv: [],

    cli: [],

    fin: [],

    led: [],

    users: [],

    cats: DEFC.slice(),

    log: []

  };

}



let S = freshState();

let ME = null;

let TAB = 'home', OPEN = false, Q = '', FS = 'all', LF = 'all';

let RT = 'cli', RC = '', RI = '', RM = TODAY.slice(0, 7), RY = TODAY.slice(0, 4);

let toastTimer;



const $ = id => document.getElementById(id);

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({

  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'

}[c]));

const money = n => Math.round(Number(n) || 0).toLocaleString('en-US') + ' ر.س';



function toast(msg) {

  const el = $('toast');

  if (!el) return;

  el.textContent = msg;

  el.hidden = false;

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => { el.hidden = true; }, 3000);

}



function setSync(state, text) {

  syncStatus = state;

  syncText = text;

  const pill = $('sync-pill');

  if (pill) {

    pill.className = 'pill ' + (state === 'ok' ? 'ok' : state === 'err' ? 'err' : '');

    const sp = pill.querySelector('span');

    if (sp) sp.textContent = text;

  }

}



function syncPill() {

  const cls = syncStatus === 'ok' ? 'ok' : syncStatus === 'err' ? 'err' : '';

  return `<div id="sync-pill" class="pill ${cls}"><i class="dot"></i><span>${esc(syncText)}</span></div>`;

}



function normalize(raw) {

  const base = freshState();

  if (!raw || typeof raw !== 'object') return base;

  const cfg = raw.cfg && typeof raw.cfg === 'object' ? {

    office: String(raw.cfg.office || 'مكتب التمويل'),

    rate: Number(raw.cfg.rate) > 0 ? Number(raw.cfg.rate) : 30,

    due: Number(raw.cfg.due) >= 1 && Number(raw.cfg.due) <= 28 ? Number(raw.cfg.due) : 27

  } : base.cfg;



  const inv = Array.isArray(raw.inv) ? raw.inv.map(i => ({

    id: String(i.id || ('i' + Math.random())),

    name: String(i.name || ''),

    rate: Number(i.rate) >= 0 ? Number(i.rate) : 0

  })) : [];



  const cli = Array.isArray(raw.cli) ? raw.cli.map(c => ({

    id: String(c.id || ('c' + Math.random())),

    code: String(c.code || ''),

    name: String(c.name || ''),

    nid: String(c.nid || ''),

    phone: String(c.phone || ''),

    by: String(c.by || '')

  })) : [];



  const fin = Array.isArray(raw.fin) ? raw.fin.map(f => ({

    id: String(f.id || ('f' + Math.random())),

    cid: String(f.cid || ''),

    src: String(f.src || 'o'),

    amt: Number(f.amt) || 0,

    date: String(f.date || TODAY),

    rate: Number(f.rate) || cfg.rate,

    dueDay: Number(f.dueDay) || cfg.due,

    share: Number(f.share) || 0,

    paid: Boolean(f.paid),

    by: String(f.by || '')

  })) : [];



  const led = Array.isArray(raw.led) ? raw.led.map(x => ({

    id: String(x.id || ('l' + Math.random())),

    date: String(x.date || TODAY),

    type: String(x.type || 'dep'),

    src: String(x.src || 'o'),

    amt: Number(x.amt) || 0,

    cat: String(x.cat || ''),

    note: String(x.note || ''),

    ref: x.ref ? String(x.ref) : ''

  })) : [];



  const users = Array.isArray(raw.users) ? raw.users.map(u => ({

    u: String(u.u || ''),

    p: String(u.p || ''),

    role: ['admin', 'acc', 'view'].includes(u.role) ? u.role : 'view',

    name: String(u.name || '')

  })).filter(u => u.u && u.p) : [];



  const cats = Array.isArray(raw.cats) && raw.cats.length ? raw.cats.map(String) : DEFC.slice();

  const log = Array.isArray(raw.log) ? raw.log.slice(-500).map(l => ({

    t: String(l.t || ''),

    u: String(l.u || ''),

    a: String(l.a || '')

  })) : [];



  return { cfg, inv, cli, fin, led, users, cats, log };

}



function docRef() {

  if (!fb || !db) return null;

  return fb.doc(db, 'artifacts', APP_ID, 'public', 'data', 'workspace', 'main');

}



async function save() {

  if (!fb || !db || !user) {

    setSync('err', 'غير متصل بالسحاب');

    toast('تم التحديث في الجلسة الحالية');

    return;

  }

  setSync('syncing', 'جاري الحفظ...');

  try {

    await fb.setDoc(docRef(), {

      cfg: S.cfg,

      inv: S.inv,

      cli: S.cli,

      fin: S.fin,

      led: S.led,

      users: S.users,

      cats: S.cats,

      log: S.log.slice(-500),

      updatedAt: new Date().toISOString()

    });

    setSync('ok', 'متصل بالسحاب');

  } catch (err) {

    console.error(err);

    setSync('err', 'خطأ في الحفظ');

    toast('تعذر الحفظ على السحاب');

  }

}



async function connectCloud() {

  try {

    const [appM, authM, fsM] = await Promise.all([

      import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"),

      import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"),

      import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js")

    ]);

    fb = {

      initializeApp: appM.initializeApp,

      getAuth: authM.getAuth,

      signInAnonymously: authM.signInAnonymously,

      onAuthStateChanged: authM.onAuthStateChanged,

      getFirestore: fsM.getFirestore,

      doc: fsM.doc,

      setDoc: fsM.setDoc,

      onSnapshot: fsM.onSnapshot

    };

    const app = fb.initializeApp(FIREBASE_CFG);

    const auth = fb.getAuth(app);

    db = fb.getFirestore(app);

    await fb.signInAnonymously(auth);

    fb.onAuthStateChanged(auth, u => {

      if (!u) return;

      user = u;

      if (unsub) {

        try { unsub(); } catch (_) {}

      }

      unsub = fb.onSnapshot(docRef(), snap => {

        if (snap.exists()) {

          S = normalize(snap.data());

          if (ME) ME = S.users.find(x => x.u === ME.u) || null;

        }

        setSync('ok', 'متصل بالسحاب');

        render();

      }, () => {

        setSync('err', 'انقطع الاتصال');

      });

    });

  } catch (_) {

    setSync('err', 'وضع غير متصل بالسحاب');

  }

}



const can = a => ME && (ME.role === 'admin' || (ME.role === 'acc' && ['fin', 'cli', 'pay'].includes(a)));

const canMod = x => ME && (ME.role === 'admin' || (ME.role === 'acc' && x.by === ME.u));

const dueStr = f => String(f.date || TODAY).slice(0, 8) + ('0' + (Number(f.dueDay) || 27)).slice(-2);

const st = f => f.paid ? 'paid' : (TODAY > dueStr(f) ? 'late' : 'open');

const ret = f => (Number(f.amt) || 0) * (Number(f.rate) || 0) / 100;

const isIn = t => t === 'dep' || t === 'pay';

const cash = () => S.led.reduce((a, x) => a + (isIn(x.type) ? (Number(x.amt) || 0) : -(Number(x.amt) || 0)), 0);



const earnedOf = s => {

  if (s === 'o') {

    const loansRet = S.fin.filter(f => f.paid).reduce((a, f) => {

      const r = ret(f);

      return a + (f.src === 'o' ? r : r * (100 - (Number(f.share) || 0)) / 100);

    }, 0);

    const exps = S.led.filter(x => x.type === 'exp').reduce((a, x) => a + (Number(x.amt) || 0), 0);

    return loansRet - exps;

  }

  return S.fin.filter(f => f.paid && f.src === s).reduce((a, f) => a + ret(f) * ((Number(f.share) || 0) / 100), 0);

};



const capOf = s => {

  const net = S.led.filter(x => x.src === s && (x.type === 'dep' || x.type === 'wd'))

    .reduce((a, x) => a + (x.type === 'dep' ? (Number(x.amt) || 0) : -(Number(x.amt) || 0)), 0);

  return net + earnedOf(s);

};



const out = s => S.fin.filter(f => f.src === s && !f.paid).reduce((a, f) => a + (Number(f.amt) || 0), 0);

const avail = s => capOf(s) - out(s);

const srcs = () => ['o'].concat(S.inv.map(i => i.id));

const nameOf = s => s === 'o' ? 'المكتب' : (S.inv.find(i => i.id === s) || { name: '—' }).name;

const cname = id => (S.cli.find(c => c.id === id) || { name: '—' }).name;

const tag = s => s === 'paid'

  ? '<span class="tag ok">مسدد</span>'

  : s === 'late'

    ? '<span class="tag bad">متأخر</span>'

    : '<span class="tag warn">مفتوح</span>';

const rowItem = (a, b, c, d, act) =>

  `<div class="item"><div class="im"><b>${a}</b><span>${b}</span></div><div class="is">${c}${d || ''}</div>${act ? `<div class="ia">${act}</div>` : ''}</div>`;



function stats() {

  const ym = TODAY.slice(0, 7);

  const r = { out: 0, late: 0, lateN: 0, month: 0, profit: 0, exp: 0, inM: 0, outM: 0, avail: 0 };

  S.fin.forEach(f => {

    const amt = Number(f.amt) || 0;

    const tot = amt + ret(f);

    const s = st(f);

    if (!f.paid) {

      r.out += amt;

      if (s === 'late') { r.late += tot; r.lateN++; }

      else if (dueStr(f).slice(0, 7) === ym) r.month += tot;

    } else {

      r.profit += f.src === 'o' ? ret(f) : ret(f) * (100 - (Number(f.share) || 0)) / 100;

    }

  });

  S.led.forEach(x => {

    const amt = Number(x.amt) || 0;

    if (x.type === 'exp') r.exp += amt;

    if (String(x.date || '').slice(0, 7) === ym) {

      if (isIn(x.type)) r.inM += amt;

      else r.outM += amt;

    }

  });

  srcs().forEach(s => { r.avail += Math.max(0, avail(s)); });

  r.net = r.profit - r.exp;

  r.cash = cash();

  return r;

}



function addLog(a) {

  S.log.push({

    t: new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 16).replace('T', ' '),

    u: ME ? ME.name : '',

    a

  });

  if (S.log.length > 500) S.log = S.log.slice(-500);

}



function ask(msg, onConfirm) {

  const d = $('dlg');

  d.innerHTML = `<div class="dbox"><p>${esc(msg)}</p><div class="ia"><button type="button" class="btn del" id="dlg-y">تأكيد</button><button type="button" class="btn ghost" id="dlg-n">إلغاء</button></div></div>`;

  d.hidden = false;

  $('dlg-n').onclick = () => { d.hidden = true; };

  $('dlg-y').onclick = () => { d.hidden = true; onConfirm(); };

}



function openForm(title, fields, onSave) {

  const d = $('dlg');

  d.innerHTML = `

    <div class="dbox">

      <h3 style="margin-bottom:12px">${esc(title)}</h3>

      ${fields.map((f, i) => `

        <div style="margin-bottom:10px">

          <label for="f_${i}">${esc(f.label)}</label>

          ${f.opts

            ? `<select id="f_${i}">${f.opts.map(o => `<option value="${esc(o[0])}"${String(o[0]) === String(f.value) ? ' selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`

            : `<input id="f_${i}" type="${f.type || 'text'}" value="${esc(f.value == null ? '' : f.value)}">`

          }

        </div>`).join('')}

        <button type="button" class="btn ghost" id="f-no">إلغاء</button>

function bars() {

  const p = TODAY.split('-'), ms = [];

  for (let i = 5; i >= 0; i--) {

    ms.push(new Date(Date.UTC(+p[0], +p[1] - 1 - i, 1)).toISOString().slice(0, 7));

  }

  const fin = ms.map(k => S.fin.filter(f => String(f.date || '').slice(0, 7) === k).reduce((a, f) => a + (Number(f.amt) || 0), 0));

  const col = ms.map(k => S.led.filter(x => x.type === 'pay' && String(x.date || '').slice(0, 7) === k).reduce((a, x) => a + (Number(x.amt) || 0), 0));

  const mx = Math.max(...fin, ...col, 1), H = 120;

  let sv = `<svg viewBox="0 0 300 ${H + 22}" width="100%" role="img" aria-label="التمويل والتحصيل آخر ستة أشهر">`;

  ms.forEach((k, i) => {

    const x = (5 - i) * 50 + 10, h1 = fin[i] / mx * H, h2 = col[i] / mx * H;

    sv += `<rect x="${x}" y="${H - h1}" width="16" height="${h1}" rx="3" fill="var(--b1)"/>`;

    sv += `<rect x="${x + 19}" y="${H - h2}" width="16" height="${h2}" rx="3" fill="var(--gold)"/>`;

    sv += `<text x="${x + 17}" y="${H + 15}" text-anchor="middle" font-size="10" fill="var(--mut)">${MN[+k.slice(5) - 1]}</text>`;

  });

  return sv + '</svg>';

}

function finItems() {

  const L = S.fin.filter(f => {

    const c = S.cli.find(x => x.id === f.cid) || {};

    return (!q || `${c.name || ''} ${c.code || ''} ${c.nid || ''}`.toLowerCase().includes(q)) && (FS === 'all' || st(f) === FS);

  }).sort((a, b) => String(a.date || '') < String(b.date || '') ? 1 : -1);



  return L.length ? L.map(f => {

    const amt = Number(f.amt) || 0;

    const fRate = Number(f.rate) || 0;

    const fShare = Number(f.share) || 0;

    return rowItem(

      esc(cname(f.cid)),

      `${esc(nameOf(f.src))} · ${esc(f.date || '')} · استحقاق ${dueStr(f)}${f.src !== 'o' ? ' · المستثمر ' + (+(fRate * fShare / 100).toFixed(1)) + '% / المكتب ' + (+(fRate - fRate * fShare / 100).toFixed(1)) + '%' : ''}`,

      `<b>${money(amt + ret(f))}</b><small>أصل ${money(amt)} + عائد ${money(ret(f))}</small>`,

      tag(st(f)),

      (!f.paid && can('pay') ? `<button type="button" class="btn sm" onclick="pay('${f.id}')">تم السداد كاملاً</button>` : '') +

      (f.paid && ME.role === 'admin' ? `<button type="button" class="btn ghost sm" onclick="undoPay('${f.id}')">تراجع عن السداد</button>` : '') +

      (!f.paid && canMod(f) ? `<button type="button" class="btn ghost sm" onclick="editFin('${f.id}')">تعديل</button>` : '') +

      (canMod(f) ? `<button type="button" class="btn del sm" onclick="delFin('${f.id}')">حذف</button>` : '')

    );

  }).join('') : '<div class="empty">لا توجد نتائج.</div>';

async function addFin() {

  const cid = $('fc').value, src = $('fs').value, a = +$('fa').value, d = $('fd').value;

  if (!cid || !(a > 0) || !d) { toast('أكمل العميل والمبلغ والتاريخ'); return; }

  if (a > avail(src)) { toast('المبلغ أكبر من المتاح في ' + nameOf(src)); return; }

  if (a > cash()) { toast('رصيد الخزنة لا يكفي'); return; }

  const id = 'f' + Date.now();

  const sh = src === 'o' ? 0 : Math.min(100, S.inv.find(i => i.id === src).rate / (+S.cfg.rate) * 100);

  S.fin.push({ id, cid, src, amt: a, date: d, rate: +S.cfg.rate, dueDay: +S.cfg.due, share: sh, paid: false, by: ME.u });

  S.led.push({ id: 'lf' + id, date: d, type: 'fin', src, amt: a, note: 'تمويل — ' + cname(cid), ref: id });

  addLog('تمويل جديد: ' + cname(cid) + ' — ' + money(a));

  render();

  toast('تم تسجيل التمويل');

  await save();

}



async function pay(id) {

  const f = S.fin.find(x => x.id === id);

  if (!f) return;

  f.paid = true;

  const tot = (Number(f.amt) || 0) + ret(f);

  S.led.push({ id: 'lp' + id, date: TODAY, type: 'pay', src: f.src, amt: tot, note: 'سداد — ' + cname(f.cid), ref: id });

  addLog('سداد: ' + cname(f.cid) + ' — ' + money(tot));

  render();

  toast('تم تسجيل السداد');

  await save();

}



function undoPay(id) {

  const f = S.fin.find(x => x.id === id);

  if (!f) return;

  ask('التراجع عن سداد ' + cname(f.cid) + '؟', async () => {

    f.paid = false;

    S.led = S.led.filter(x => !(x.ref === id && x.type === 'pay'));

    addLog('تراجع عن السداد: ' + cname(f.cid));

    render();

    toast('تم التراجع عن السداد');

    await save();

  });

}



function delFin(id) {

  const f = S.fin.find(x => x.id === id);

  if (!f || !canMod(f)) return;

  ask('حذف تمويل ' + cname(f.cid) + ' بمبلغ ' + money(f.amt) + '؟', async () => {

    S.fin = S.fin.filter(x => x.id !== id);

    S.led = S.led.filter(x => x.ref !== id);

    addLog('حذف تمويل: ' + cname(f.cid) + ' — ' + money(f.amt));

    render();

    toast('تم الحذف');

    await save();

  });

}



function editFin(id) {

  const f = S.fin.find(x => x.id === id);

  if (!f || f.paid || !canMod(f)) return;

  openForm('تعديل تمويل', [

    { label: 'العميل', opts: S.cli.map(c => [c.id, c.code + ' — ' + c.name]), value: f.cid },

    { label: 'مصدر المال', opts: srcs().map(x => [x, nameOf(x)]), value: f.src },

    { label: 'المبلغ', type: 'number', value: f.amt },

    { label: 'التاريخ', type: 'date', value: f.date }

  ], async v => {

    const a = +v[2], src = v[1];

    if (!(a > 0) || !v[3]) { toast('أكمل المبلغ والتاريخ'); return false; }

    const room = avail(src) + (src === f.src ? (Number(f.amt) || 0) : 0);

    if (a > room) { toast('المبلغ أكبر من المتاح في ' + nameOf(src)); return false; }

    if (cash() + (Number(f.amt) || 0) - a < 0) { toast('رصيد الخزنة لا يكفي'); return false; }

    f.cid = v[0]; f.src = src; f.amt = a; f.date = v[3];

    f.share = src === 'o' ? 0 : Math.min(100, S.inv.find(i => i.id === src).rate / f.rate * 100);

    const l = S.led.find(x => x.ref === id && x.type === 'fin');

    if (l) { l.src = src; l.amt = a; l.date = v[3]; l.note = 'تمويل — ' + cname(f.cid); }

    addLog('تعديل تمويل: ' + cname(f.cid) + ' — ' + money(a));

    render();

    toast('تم التعديل');

    await save();

  });

}

async function addCli() {

  if (!n || !i) { toast('الاسم ورقم الهوية مطلوبان'); return; }

  if (S.cli.some(c => c.nid === i)) { toast('رقم الهوية مسجل من قبل'); return; }

  S.cli.push({ id: 'c' + Date.now(), code: 'C' + ('00' + (S.cli.length + 1)).slice(-3), name: n, nid: i, phone: p, by: ME.u });

  addLog('عميل جديد: ' + n);

function editCli(id) {

  const c = S.cli.find(x => x.id === id);

  if (!c || !canMod(c)) return;

  openForm('تعديل عميل', [

    { label: 'الاسم', value: c.name },

    { label: 'رقم الهوية', value: c.nid },

    { label: 'الجوال', value: c.phone }

  ], async v => {

    const n = v[0].trim(), i = v[1].trim();

    if (!n || !i) { toast('الاسم ورقم الهوية مطلوبان'); return false; }

    if (S.cli.some(x => x.id !== id && x.nid === i)) { toast('رقم الهوية مسجل لعميل آخر'); return false; }

    c.name = n; c.nid = i; c.phone = v[2].trim();

    S.led.forEach(x => {

      if (x.ref) {

        const f = S.fin.find(y => y.id === x.ref);

        if (f && f.cid === id) x.note = (x.type === 'pay' ? 'سداد — ' : 'تمويل — ') + n;

      }

    });

async function addOp() {

  const t = $('ot').value, s = $('os').value, a = +$('oa').value, n = $('on').value.trim(), c = t === 'exp' ? $('oc2').value : '';

  if (t === 'exp' && !c) { toast('اختر بند المصروف أولاً'); return; }

  if (!(a > 0)) { toast('اكتب المبلغ'); return; }

  if (t !== 'dep') {

    if (a > cash()) { toast('المبلغ أكبر من رصيد الخزنة'); return; }

    if (t === 'wd' && a > avail(s)) { toast('المبلغ أكبر من المتاح في ' + nameOf(s)); return; }

  }

  S.led.push({ id: 'l' + Date.now(), date: TODAY, type: t, src: t === 'exp' ? 'o' : s, amt: a, cat: c, note: t === 'exp' ? c + (n ? ' — ' + n : '') : (n || LB[t]) });

  addLog(LB[t] + ': ' + (c || nameOf(s)) + ' — ' + money(a));

  render();

  toast('تم التسجيل');

  await save();

}



function editOp(id) {

  const x = S.led.find(y => y.id === id);

  if (!x || ME.role !== 'admin' || x.ref) return;

  const ex = x.type === 'exp';

  const memo = ex ? (x.cat && x.note.startsWith(x.cat) ? x.note.slice(x.cat.length).replace(/^ — /, '') : '') : x.note;

  const fields = [

    { label: 'التاريخ', type: 'date', value: x.date },

    { label: 'المبلغ', type: 'number', value: x.amt }

  ];

  if (ex) {

    fields.push({ label: 'بند المصروف', opts: S.cats.concat(S.cats.includes(x.cat) || !x.cat ? [] : [x.cat]).map(c => [c, c]), value: x.cat });

  }

  fields.push({ label: 'ملاحظة', value: memo });



  openForm('تعديل حركة', fields, async v => {

    const a = +v[1];

    if (!(a > 0) || !v[0]) { toast('أكمل التاريخ والمبلغ'); return false; }

    const old = Object.assign({}, x);

    const cat = ex ? v[2] : '';

    const m = ex ? v[3].trim() : v[2].trim();

    x.date = v[0]; x.amt = a; x.cat = cat; x.note = ex ? cat + (m ? ' — ' + m : '') : (m || LB[x.type]);

    if (cash() < 0 || avail(x.src) < 0) {

      Object.assign(x, old);

      toast('التعديل يجعل الرصيد أو المتاح سالباً');

      return false;

    }

    addLog('تعديل حركة: ' + x.note + ' — ' + money(a));

    render();

    toast('تم التعديل');

    await save();

  });

}



function delOp(id) {

  const x = S.led.find(y => y.id === id);

const payOf = f => S.led.find(x => x.ref === f.id && x.type === 'pay');

const mlab = ym => MN[+ym.slice(5) - 1] + ' ' + ym.slice(0, 4);

const rh = t => `<div class="card"><div class="rh"><h3>${esc(S.cfg.office)}</h3><span>${t} · صدر بتاريخ ${TODAY}</span></div></div>`;

const tl = (a, b, c) => `<div class="t" style="cursor:default"><small>${a}</small><b${c ? ` class="${c}"` : ''}>${b}</b></div>`;



function prt() {

function stmt(id) {

function mstat(ym) {

  const safeYm = /^\d{4}-\d{2}$/.test(ym) ? ym : TODAY.slice(0, 7);

  const r = { n: 0, iss: 0, col: 0, retSum: 0, co: 0, inv: 0, exp: 0, expd: 0, gotd: 0, late: 0, inM: 0, outM: 0, net: 0 };

  S.fin.forEach(f => {

    const fDate = String(f.date || '');

    const amt = Number(f.amt) || 0;

    const share = Number(f.share) || 0;

    const fRet = ret(f);

    const dStr = dueStr(f);

    if (fDate.slice(0, 7) === safeYm) { r.n++; r.iss += amt; }

    const p = payOf(f);

    if (p && String(p.date || '').slice(0, 7) === safeYm) {

      r.col += Number(p.amt) || 0;

      r.retSum += fRet;

      r.co += f.src === 'o' ? fRet : fRet * (100 - share) / 100;

      if (f.src !== 'o') r.inv += fRet * share / 100;

    }

    if (dStr.slice(0, 7) === safeYm) {

      r.expd += amt + fRet;

      if (f.paid) r.gotd += amt + fRet;

      else if (TODAY > dStr) r.late += amt + fRet;

    }

  });

  S.led.forEach(x => {

    const xDate = String(x.date || '');

    const amt = Number(x.amt) || 0;

    if (xDate.slice(0, 7) === safeYm) {

      if (x.type === 'exp') r.exp += amt;

      if (isIn(x.type)) r.inM += amt;

      else r.outM += amt;

    }

  });

  r.net = r.co - r.exp;

  return r;

}

function cliStmt() {

  if (!S.cli.length) return rh('كشف حساب عميل') + '<div class="card empty">لا يوجد عملاء مسجلون بعد.</div>';

    `<div class="card"><div class="rh"><h3>${esc(c.name)}</h3><span>${esc(c.code)} · هوية ${esc(c.nid)} · ${esc(c.phone || '—')}</span></div></div>` +

    `<div class="card"><h3>حركة الحساب</h3>${rows.length ? `<div class="tw"><table><thead><tr><th>التاريخ</th><th>البيان</th><th>عليه</th><th>له</th><th>الرصيد</th></tr></thead><tbody>${tr}</tbody><tfoot><tr><td colspan="2">الإجمالي</td><td>${money(td)}</td><td>${money(tc)}</td><td>${money(bal)}</td></tr></tfoot></table></div>` : '<div class="empty">لا توجد حركات لهذا العميل.</div>'}</div>`;

}



function srcStmt() {

  const sl = srcs();

  if (!sl.includes(RI)) RI = sl.length > 1 ? sl[1] : sl[0];

  const s = RI, inv = s !== 'o', fs = S.fin.filter(f => f.src === s);

  const got = fs.filter(f => f.paid).reduce((a, f) => a + ret(f) * (Number(f.share) || 0) / 100, 0);

  const exp = fs.filter(f => !f.paid).reduce((a, f) => a + ret(f) * (Number(f.share) || 0) / 100, 0);

  const co = fs.filter(f => f.paid).reduce((a, f) => a + (inv ? ret(f) * (100 - (Number(f.share) || 0)) / 100 : ret(f)), 0);

  const mv = S.led.filter(x => x.src === s && (x.type === 'dep' || x.type === 'wd')).sort((a, b) => String(a.date || '') < String(b.date || '') ? -1 : 1);



  return rh('كشف ' + (inv ? 'مستثمر' : 'أموال المكتب')) +

    `<select class="sel" aria-label="المصدر" onchange="RI=this.value;render()">${sl.map(x => `<option value="${esc(x)}"${x === s ? ' selected' : ''}>${esc(nameOf(x))}</option>`).join('')}</select>` +

    `<div class="tiles">${tl('الرصيد الجاهز', money(capOf(s)))}${tl('عوائد محصّلة', money(earnedOf(s)), earnedOf(s) >= 0 ? 'ok' : 'bad')}${tl('مموَّل حالياً', money(out(s)))}${tl('المتاح للتمويل', money(avail(s)))}${inv ? tl('نصيبه المحصّل', money(got), 'ok') + tl('نصيبه المتوقع', money(exp)) : ''}${tl('حصة الشركة', money(co))}</div>` +

    `<div class="card"><h3>التمويلات من هذا المصدر</h3>${fs.length ? `<div class="tw"><table><thead><tr><th>العميل</th><th>التاريخ</th><th>الأصل</th><th>العائد</th>${inv ? '<th>نصيب المستثمر</th>' : ''}<th>الحالة</th></tr></thead><tbody>${fs.sort((a, b) => String(a.date || '') < String(b.date || '') ? 1 : -1).map(f => `<tr><td>${esc(cname(f.cid))}</td><td>${esc(f.date || '')}</td><td>${money(Number(f.amt) || 0)}</td><td>${money(ret(f))}</td>${inv ? `<td>${money(ret(f) * (Number(f.share) || 0) / 100)}</td>` : ''}<td>${tag(st(f))}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">لا توجد تمويلات.</div>'}</div>` +

    `<div class="card"><h3>الإيداع والسحب</h3>${mv.length ? mv.map(x => rowItem(esc(x.note), esc(x.date || '') + ' · ' + LB[x.type], `<b class="${x.type === 'dep' ? 'ok' : 'bad'}">${x.type === 'dep' ? '+' : '−'} ${money(Number(x.amt) || 0)}</b>`)).join('') : '<div class="empty">لا توجد حركات.</div>'}</div>`;

}

        <div><label for="sr">نسبة العائد %</label><input id="sr" type="number" value="${S.cfg.rate}"></div>

        <div><label for="sd">يوم الاستحقاق</label><input id="sd" type="number" min="1" max="28" value="${S.cfg.due}"></div>

        <button type="button" class="btn" onclick="saveCfg()">حفظ</button>

      </div>

    </div>

    <div class="card">

      <h3>المستثمرون</h3>

      ${S.inv.map(i => rowItem(

        esc(i.name),

        `رصيده ${money(capOf(i.id))} · عوائد ${money(earnedOf(i.id))} · متاح ${money(avail(i.id))}`,

        `<b>عائد المستثمر ${i.rate}%</b><small>عائد المكتب ${+(S.cfg.rate - i.rate).toFixed(1)}%</small>`,

        '',

        `<button type="button" class="btn ghost sm" onclick="editInv('${i.id}')">تعديل</button><button type="button" class="btn del sm" onclick="delInv('${i.id}')">حذف</button>`

      )).join('') || '<div class="empty">لا يوجد مستثمرون.</div>'}

      <div class="form" style="margin-top:14px">

        <div><label for="in">اسم المستثمر</label><input id="in"></div>

        <div><label for="is">عائد المستثمر %</label><input id="is" type="number" step="0.5"></div>

        <div><label for="ic">مبلغ الإيداع</label><input id="ic" type="number"></div>

        <button type="button" class="btn" onclick="addInv()">إضافة مستثمر</button>

      </div>

    </div>

    <div class="card">

      <h3>بنود المصروفات</h3>

      <div class="chips" style="margin-top:0">

        ${S.cats.map((c, i) => `<span class="chip">${esc(c)} <button type="button" class="btn del sm" style="padding:0 6px;border:0;min-height:auto" onclick="delCat(${i})">✕</button></span>`).join('')}

      </div>

      <div class="form" style="margin-top:12px">

        <div><label for="nc">بند جديد</label><input id="nc"></div>

        <button type="button" class="btn" onclick="addCat()">إضافة بند</button>

      </div>

    </div>

    <div class="card">

      <h3>النسخ الاحتياطي</h3>

      <textarea id="bk" rows="4" aria-label="النسخة الاحتياطية"></textarea>

      <div class="ia" style="margin-top:10px">

        <button type="button" class="btn sm" onclick="bkShow()">عرض النسخة</button>

        <button type="button" class="btn ghost sm" onclick="bkCopy()">نسخ</button>

        <button type="button" class="btn ghost sm" onclick="bkDownload()">تحميل JSON</button>

        <button type="button" class="btn del sm" onclick="bkRestore()">استيراد ورفع للسحاب</button>

      </div>

    </div>

    <div class="card">

      <h3>سجل النشاط</h3>

      ${S.log.slice(-30).reverse().map(x => rowItem(esc(x.a), esc(x.t) + ' · ' + esc(x.u), '')).join('') || '<div class="empty">لا توجد أنشطة بعد.</div>'}

    </div>`;

}



async function saveCfg() {

  const r = +$('sr').value, d = +$('sd').value, o = $('so').value.trim();

  if (!(r > 0) || !(d >= 1 && d <= 28) || !o) { toast('تحقق من القيم المدخلة'); return; }

  if (S.inv.some(i => i.rate > r)) { toast('نسبة العائد أقل من عائد أحد المستثمرين'); return; }

  S.cfg = { office: o, rate: r, due: d };

  addLog('تعديل الإعدادات');

  render();

  toast('تم حفظ الإعدادات');

  await save();

}



async function addInv() {

  const n = $('in').value.trim(), r = +$('is').value, c = +$('ic').value || 0;

  if (!n || !(r >= 0 && r <= S.cfg.rate)) { toast('اكتب الاسم وعائد المستثمر بين 0 و ' + S.cfg.rate + '%'); return; }

  const id = 'i' + Date.now();

  S.inv.push({ id, name: n, rate: r });

  if (c > 0) S.led.push({ id: 'l' + Date.now(), date: TODAY, type: 'dep', src: id, amt: c, note: 'إيداع ' + n });

  addLog('مستثمر جديد: ' + n);

  render();

  toast('تمت إضافة المستثمر');

  await save();

}



function editInv(id) {

  const i = S.inv.find(x => x.id === id);

  if (!i || ME.role !== 'admin') return;

  openForm('تعديل مستثمر', [

    { label: 'الاسم', value: i.name },

    { label: 'عائد المستثمر % (من ' + S.cfg.rate + '%)', type: 'number', value: i.rate }

  ], async v => {

    const r = +v[1];

    if (!v[0].trim() || !(r >= 0 && r <= S.cfg.rate)) { toast('تحقق من البيانات'); return false; }

    i.name = v[0].trim(); i.rate = r;

    addLog('تعديل مستثمر: ' + i.name);

    render();

    toast('تم التعديل');

    await save();

  });

}



function delInv(id) {

  if (out(id) > 0) { toast('عليه تمويلات مفتوحة'); return; }

  if (capOf(id) > 0) { toast('اسحب رصيده أولاً'); return; }

  const i = S.inv.find(x => x.id === id);

  ask('حذف المستثمر ' + (i ? i.name : '') + '؟', async () => {

    S.inv = S.inv.filter(x => x.id !== id);

    addLog('حذف مستثمر: ' + (i ? i.name : ''));

    render();

    toast('تم الحذف');

    await save();

  });

}



async function addCat() {

  const c = $('nc').value.trim();

  if (!c) { toast('اكتب اسم البند'); return; }

  if (S.cats.includes(c)) { toast('البند موجود'); return; }

  S.cats.push(c);

  addLog('بند مصروف جديد: ' + c);

  render();

  await save();

}



async function delCat(i) {

  const c = S.cats[i];

  S.cats.splice(i, 1);

  addLog('حذف بند مصروف: ' + c);

  render();

  await save();

}



function bkShow() { $('bk').value = JSON.stringify(S); }



function bkCopy() {

  bkShow();

  const el = $('bk');

  el.select();

  el.setSelectionRange(0, 999999);

  try {

    toast(document.execCommand('copy') ? 'تم نسخ النسخة الاحتياطية' : 'انسخ النص يدوياً');

  } catch (_) {

    toast('انسخ النص يدوياً');

  }

}



function bkDownload() {

  const data = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(S, null, 2));

  const a = document.createElement('a');

  a.href = data;

  a.download = 'tamweel-backup-' + TODAY + '.json';

  document.body.appendChild(a);

  a.click();

  a.remove();

  toast('تم تحميل الملف');

}



function bkRestore() {

  let parsed;

  try { parsed = JSON.parse($('bk').value); } catch (_) { toast('النص غير صالح'); return; }

  if (!parsed || !parsed.cfg || !['inv', 'cli', 'fin', 'led', 'users'].every(k => Array.isArray(parsed[k])) || !parsed.users.some(x => x.role === 'admin')) {

    toast('هذه ليست نسخة احتياطية صحيحة');

    return;

  }

  ask('سيتم استبدال البيانات الحالية بالنسخة المستوردة. متأكد؟', async () => {

    S = normalize(parsed);

    ME = S.users.find(x => x.u === ME.u && x.p === ME.p) || S.users.find(x => x.role === 'admin') || null;

    addLog('استعادة نسخة احتياطية');

    render();

    toast('تمت الاستعادة');

    await save();

  });

}



function vUsr() {

  return `

    <div class="card">

      <h3>المستخدمون والصلاحيات</h3>

      ${S.users.map(u => rowItem(

        esc(u.name),

        '@' + esc(u.u),

        `<b>${ROLE[u.role]}</b>`,

        '',

        `<button type="button" class="btn ghost sm" onclick="editUsr('${esc(u.u)}')">تعديل</button>` +

        (u.u === ME.u ? '' : `<button type="button" class="btn del sm" onclick="delUsr('${esc(u.u)}')">حذف</button>`)

      )).join('')}

      <div class="form" style="margin-top:14px">

        <div><label for="nu">اسم المستخدم</label><input id="nu" autocomplete="off"></div>

        <div><label for="nn">الاسم</label><input id="nn"></div>

        <div><label for="np">كلمة المرور</label><input id="np"></div>

        <div><label for="nr">الصلاحية</label><select id="nr"><option value="admin">مدير</option><option value="acc">محاسب</option><option value="view">مشاهدة فقط</option></select></div>

        <button type="button" class="btn" onclick="addUsr()">إضافة مستخدم</button>

      </div>

    </div>`;

}



async function addUsr() {

  const u = $('nu').value.trim(), n = $('nn').value.trim(), p = $('np').value, r = $('nr').value;

  if (!u || !n || p.length < 4) { toast('أكمل البيانات (كلمة المرور 4 أحرف على الأقل)'); return; }

  if (S.users.some(x => x.u === u)) { toast('اسم المستخدم مستخدم من قبل'); return; }

  S.users.push({ u, p, role: r, name: n });

  addLog('مستخدم جديد: ' + u);

  render();

  toast('تمت إضافة المستخدم');

  await save();

}



function editUsr(un) {

  const u = S.users.find(x => x.u === un);

  if (!u || ME.role !== 'admin') return;

  const self = u.u === ME.u;

  const fields = [

    { label: 'الاسم', value: u.name },

    { label: 'كلمة مرور جديدة (اتركها فارغة للإبقاء على الحالية)', value: '' }

  ];

  if (!self) fields.push({ label: 'الصلاحية', opts: [['admin','مدير'],['acc','محاسب'],['view','مشاهدة فقط']], value: u.role });

  openForm('تعديل مستخدم', fields, async v => {

    if (!v[0].trim()) { toast('الاسم مطلوب'); return false; }

    if (v[1] && v[1].length < 4) { toast('كلمة المرور قصيرة'); return false; }

    u.name = v[0].trim();

    if (v[1]) u.p = v[1];

    if (!self) u.role = v[2];

    addLog('تعديل مستخدم: ' + u.u);

    render();

    toast('تم التعديل');

    await save();

  });

}



function delUsr(u) {

  ask('حذف المستخدم ' + u + '؟', async () => {

    S.users = S.users.filter(x => x.u !== u);

    addLog('حذف مستخدم: ' + u);

    render();

    await save();

  });

}



Object.assign(window, {

  go, tog, login, logout, doSetup, openInitialRestore, render,

  setFS, finItems, addFin, pay, undoPay, delFin, editFin,

  addCli, editCli, delCli, stmt,

  setLF, opType, addOp, editOp, delOp,

  prt, saveCfg, addInv, editInv, delInv, addCat, delCat,

  bkShow, bkCopy, bkDownload, bkRestore, addUsr, editUsr, delUsr

});



render();

connectCloud();

</script>

</body>

</html>
